# about_title: About Me
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Hello, my name is Ha Anh NGO, and I'm a first-year PhD student in the [ALMAnaCH lab](https://almanach.inria.fr/index-en.html) at Inria Paris, specializing in <mark>Multimodal models of repair in social human-agent interaction</mark>. Before my doctoral studies, I got a Master's degree in Applied Computer Science from Wroclaw University of Science and Technology in Poland, where I worked on some CLARIN-PL projects focused on text-based emotion recognition.
  Outside of research, I enjoy reading, traveling, and capturing memories through photography.

